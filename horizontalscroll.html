<!doctype html>
<html>
    <head>
        <link rel="stylesheet" href="horizontalscroll.css">
        <link href="https://fonts.googleapis.com/css2?family=Abel&display=swap" rel="stylesheet">        
        <script>
            document.addEventListener('DOMContentLoaded', function(){
			const options={
				root: null,
				rootMargin: '0px',
				threshold: 0.5
			};
            const sections = document.querySelectorAll('section')
            const observer = new IntersectionObserver(
                (entries, observe) => {
                    
                entries.forEach(entry => {
                    let sectionClassName=entry.target.id;
                    if (entry.isIntersecting){
                        document.querySelector('.'+sectionClassName).style.transform = 'scale(1.3)';
                    }else{
                        document.querySelector('.'+sectionClassName).style.transform = 'scale(1)';

					}
                });
            }, options);
            sections.forEach(section => {
                observer.observe(section);
            })
            
        })
        </script>
    </head>
